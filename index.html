<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live BTC Buy/Sell Signal</title>
<style>
  :root{--bg:#0b0e14;--panel:#131722;--buy:#00c896;--sell:#ff5c5c;--text:#e6e9ef;--muted:#8a93a6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  h1{font-size:1.2rem;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:0.85rem;margin:0 0 12px}
  .panel{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:14px}
  canvas{width:100%;height:auto;border-radius:8px}
  .status{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .price{font-size:1.6rem;font-weight:700}
  .badge{padding:4px 12px;border-radius:20px;font-weight:700;font-size:0.85rem}
  .badge.buy{background:rgba(0,200,150,.15);color:var(--buy)}
  .badge.sell{background:rgba(255,92,92,.15);color:var(--sell)}
  .badge.wait{background:rgba(138,147,166,.15);color:var(--muted)}
  .tf-row{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
  .tf-btn{flex:none;background:#1c2230;color:var(--muted);border:none;border-radius:8px;padding:8px 14px;font-weight:600;font-size:0.85rem}
  .tf-btn.active{background:#4dabf7;color:#04121f}
  .signals{max-height:200px;overflow-y:auto;font-size:0.85rem}
  .sig-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #222838}
  .err{color:var(--sell);font-size:0.85rem}
  button.refresh{background:#4dabf7;color:#04121f;border:none;border-radius:8px;padding:10px 16px;font-weight:600;width:100%}
</style>
</head>
<body>
  <h1>📈 Live BTC/USDT — Candlestick Signal</h1>
  <p class="sub">Data seedha Binance se (free, live).</p>

  <div class="tf-row" id="tfRow">
    <button class="tf-btn" data-tf="1m">1m</button>
    <button class="tf-btn" data-tf="5m">5m</button>
    <button class="tf-btn active" data-tf="15m">15m</button>
    <button class="tf-btn" data-tf="1h">1h</button>
    <button class="tf-btn" data-tf="4h">4h</button>
    <button class="tf-btn" data-tf="1d">1D</button>
  </div>

  <div class="panel">
    <div class="status">
      <div class="price" id="priceBox">Loading...</div>
      <div class="badge wait" id="statusBadge">WAIT</div>
    </div>
    <canvas id="chart" width="700" height="340"></canvas>
    <div id="errBox" class="err"></div>
  </div>

  <div class="panel">
    <button class="refresh" onclick="load()">🔄 Refresh</button>
  </div>

  <div class="panel">
    <strong>Recent Signals:</strong>
    <div class="signals" id="signalList"></div>
  </div>

<script>
let currentTF = '15m';

document.getElementById('tfRow').addEventListener('click', (e)=>{
  if(!e.target.dataset.tf) return;
  document.querySelectorAll('.tf-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  currentTF = e.target.dataset.tf;
  load();
});

function ema(data, period){
  const k = 2/(period+1);
  let out=[data[0]];
  for(let i=1;i<data.length;i++) out.push(data[i]*k + out[i-1]*(1-k));
  return out;
}

async function load(){
  const errBox = document.getElementById('errBox');
  errBox.textContent = '';
  try{
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${currentTF}&limit=80`);
    const raw = await res.json();
    const candles = raw.map(c => ({
      open: parseFloat(c[1]), high: parseFloat(c[2]),
      low: parseFloat(c[3]), close: parseFloat(c[4])
    }));
    const closes = candles.map(c=>c.close);
    const e1 = ema(closes, 9);
    const e2 = ema(closes, 21);

    const rawSignals = [];
    for(let i=1;i<closes.length;i++){
      if(e1[i-1] <= e2[i-1] && e1[i] > e2[i]) rawSignals.push({i, type:'BUY', price:closes[i]});
      if(e1[i-1] >= e2[i-1] && e1[i] < e2[i]) rawSignals.push({i, type:'SELL', price:closes[i]});
    }
    // Whipsaw filter: ignore a signal if it's too close to the previous one (noise)
    const MIN_GAP = 4; // candles
    const signals = [];
    let lastIdx = -999;
    rawSignals.forEach(s=>{
      if(s.i - lastIdx >= MIN_GAP){
        signals.push(s);
        lastIdx = s.i;
      }
    });

    document.getElementById('priceBox').textContent = '$' + closes[closes.length-1].toFixed(2);
    const badge = document.getElementById('statusBadge');
    if(e1[e1.length-1] > e2[e2.length-1]){ badge.textContent='BUY ZONE'; badge.className='badge buy'; }
    else { badge.textContent='SELL ZONE'; badge.className='badge sell'; }

    drawCandles(candles, e1, e2, signals);
    renderList(signals);
  }catch(e){
    errBox.textContent = 'Data load nahi hui. Internet check karein. (' + e.message + ')';
  }
}

function drawCandles(candles, e1, e2, signals){
  const cv = document.getElementById('chart');
  const ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height, pad=20;
  ctx.clearRect(0,0,W,H);

  const highs = candles.map(c=>c.high), lows = candles.map(c=>c.low);
  const min = Math.min(...lows, ...e1, ...e2);
  const max = Math.max(...highs, ...e1, ...e2);
  const n = candles.length;
  const slot = (W-2*pad)/n;
  const bodyW = Math.max(2, slot*0.6);
  const x = i => pad + i*slot + slot/2;
  const y = v => H-pad - (v-min)*(H-2*pad)/(max-min);

  candles.forEach((c,i)=>{
    const up = c.close >= c.open;
    ctx.strokeStyle = ctx.fillStyle = up ? '#00c896' : '#ff5c5c';
    ctx.beginPath();
    ctx.moveTo(x(i), y(c.high));
    ctx.lineTo(x(i), y(c.low));
    ctx.stroke();
    const yO = y(c.open), yC = y(c.close);
    ctx.fillRect(x(i)-bodyW/2, Math.min(yO,yC), bodyW, Math.max(1,Math.abs(yC-yO)));
  });

  function line(arr,color,w){
    ctx.beginPath();
    arr.forEach((v,i)=> i===0?ctx.moveTo(x(i),y(v)):ctx.lineTo(x(i),y(v)));
    ctx.strokeStyle=color; ctx.lineWidth=w; ctx.stroke();
  }
  line(e1,'#7bd88f',1.5);
  line(e2,'#ff9f43',1.5);

  signals.forEach(s=>{
    const c = candles[s.i];
    const isBuy = s.type === 'BUY';
    const cx = x(s.i);
    const cy = isBuy ? y(c.low) + 14 : y(c.high) - 14;
    ctx.beginPath();
    if(isBuy){
      ctx.moveTo(cx, cy+9); ctx.lineTo(cx-8, cy+22); ctx.lineTo(cx+8, cy+22);
    } else {
      ctx.moveTo(cx, cy-9); ctx.lineTo(cx-8, cy-22); ctx.lineTo(cx+8, cy-22);
    }
    ctx.closePath();
    ctx.fillStyle = isBuy ? '#00c896' : '#ff5c5c';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.fill();
    ctx.stroke();
  });
}

function renderList(signals){
  const el = document.getElementById('signalList');
  if(!signals.length){ el.innerHTML = 'Is range mein koi crossover nahi mila.'; return; }
  el.innerHTML = signals.slice().reverse().map(s=>`
    <div class="sig-row"><span>${s.type}</span><span>$${s.price.toFixed(2)}</span></div>`).join('');
}

load();
setInterval(load, 10000); // auto-refresh every 10 seconds
</script>
</body>
</html>
