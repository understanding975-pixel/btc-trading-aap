<title>Live Crypto Buy/Sell Signal</title>
<style>
:root{--up:#0ecb81;--dn:#f6465d;--bg:#0b0e14;--panel:#131722;--buy:#00c896;--sell:#ff5c5c;--text:#e8ecf3;--muted:#8b93a7;--blue:#4facfe}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
h1{font-size:1.2rem;margin:0 0 4px;line-height:1.2}
p.sub{color:var(--muted);font-size:.85rem;margin:0 0 12px}
.subrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin:0 0 12px}
.subrow p.sub{margin:0}
.back{flex:none;background:#1a2030;border:1px solid #2a3350;color:var(--blue);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:8px}
.row{display:flex;gap:6px;overflow-x:auto}
.row::-webkit-scrollbar{display:none}
#tfs{margin-bottom:8px}
#inds{margin-bottom:12px}
.chip{flex:0 0 auto;border:0;border-radius:10px;padding:7px 13px;background:#1a2030;color:var(--muted);font-size:.95rem;font-weight:600}
.chip.on{background:var(--blue);color:#06121f}
.ind{flex:none;border:1px solid #2a3350;background:none;color:var(--muted);border-radius:8px;padding:4px 11px;font-size:.8rem;font-weight:700}
.ind.on{background:#1f2b4a;color:#fff;border-color:var(--blue)}
.panel{background:var(--panel);border-radius:16px;padding:14px;margin-top:14px}
#inds+.panel{margin-top:0}
.top{display:flex;justify-content:space-between;align-items:center}
.price{font-size:1.6rem;font-weight:700}
.badge{padding:4px 12px;border-radius:20px;font-weight:700;font-size:.85rem}
.buy{background:#0d3a31;color:var(--buy)}
.sell{background:#3a1717;color:var(--sell)}
canvas{width:100%;height:150px;display:block;margin-top:8px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.cw{position:relative}
.now{display:none;position:absolute;right:58px;bottom:24px;border:1px solid #2b3350;background:#161c2b;color:#eaecef;border-radius:14px;padding:3px 10px;font-size:.72rem;font-weight:700}
.hint{font-size:.68rem;color:#8b93a7;margin:6px 0 0;text-align:center}
button.r{width:100%;border:0;border-radius:12px;padding:8px;background:var(--blue);color:#06121f;font-weight:700;font-size:1rem}
.panel b{font-size:1.17rem;display:block}
.sig{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1f2535}
.err{color:var(--sell);font-size:.8rem;margin-top:6px}
.tabs{display:flex;gap:18px;margin:4px 0 8px}
.tab{background:none;border:0;color:var(--muted);font-weight:700;padding:6px 0;font-size:.95rem;border-bottom:3px solid transparent}
.tab.on{color:var(--text);border-color:#f7b731}
.hd,.item{display:grid;grid-template-columns:1.2fr 1.2fr .9fr;align-items:center;gap:8px}
.hd{color:var(--muted);font-size:.72rem;padding:6px 4px}
.hd span:nth-child(2),.hd span:nth-child(3){text-align:right}
.item{padding:10px 4px;border-bottom:1px solid #1f2535;cursor:pointer}
.nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.lg{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.75rem}
.pr{text-align:right;font-weight:700}
.chg{text-align:right}
.chg span{display:inline-block;min-width:66px;padding:7px 4px;border-radius:8px;text-align:center;font-weight:700;color:#fff;font-size:.82rem}
.up{background:var(--up)}.dn{background:var(--dn)}

body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button.r{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#4facfe,#2b6df6);color:#fff;box-shadow:0 4px 14px rgba(43,109,246,.35);transition:transform .15s}
button.r:active{transform:scale(.97)}
.ri{width:18px;height:18px}
.spin .ri,.spin>svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== Exchange page ===== */
.xh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.xb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#fff;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.08)}
.xb img{width:100%;height:100%;object-fit:cover}
.xt{flex:1;min-width:0}
.xn{font-size:1.2rem;font-weight:800;line-height:1.1}
.xs{font-size:.72rem;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#f0b90b;box-shadow:0 0 8px currentColor;color:#f0b90b}
.dot.ok{background:var(--buy);color:var(--buy)}.dot.bad{background:var(--sell);color:var(--sell)}
.rfb{width:46px;height:46px;border-radius:50%;border:0;color:#fff;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4facfe,#2b6df6);box-shadow:0 6px 18px rgba(43,109,246,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.rfb:active{transform:scale(.92)}
.rfb svg{width:22px;height:22px}
.sign{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:.85rem;color:#ffd75e;background:rgba(240,185,11,.08);border:1px solid rgba(240,185,11,.35);padding:9px;border-radius:12px;margin-bottom:10px}
.qs{width:100%;background:#0e1220;border:1px solid #2a3350;border-radius:12px;color:var(--text);padding:11px 12px;font-size:.92rem;margin-bottom:8px}
.qs:focus{outline:0;border-color:var(--blue)}
.srt{display:flex;gap:5px;margin-bottom:8px;overflow-x:auto}
.srt::-webkit-scrollbar{display:none}
.sb{flex:0 0 auto;border:1px solid #2a3350;background:none;color:var(--muted);border-radius:8px;padding:5px 9px;font-size:.76rem;font-weight:700}
.sb.on{background:#1f2b4a;color:#fff;border-color:var(--blue)}
.cl{background:var(--panel);border-radius:16px;padding:4px 12px}
.ch{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;color:var(--muted);font-size:.7rem;padding:10px 0 6px}
.ch span:nth-child(n+2){text-align:right}
.cr{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px;align-items:center;padding:10px 0;border-top:1px solid #1f2535;cursor:pointer}
.cr:active{background:rgba(255,255,255,.03)}
.cc{display:flex;align-items:center;gap:10px;min-width:0}
.cc img,.cc .lf{width:30px;height:30px;border-radius:50%;flex:none;background:#1a2030}
.cc .lf{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff}
.cs b{font-size:.98rem}.cs small{color:var(--muted);font-size:.72rem;margin-left:2px}
.cs div{color:var(--muted);font-size:.68rem;margin-top:1px}
.cp{text-align:right;font-weight:700;font-size:.92rem}
.cg{text-align:right}
.cg span{display:inline-block;min-width:66px;padding:7px 4px;border-radius:8px;text-align:center;font-weight:700;color:#fff;font-size:.8rem}
.cg .u{background:var(--up)}.cg .d{background:var(--dn)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:.85rem}
.empty button{margin-top:10px;border:0;border-radius:10px;padding:9px 16px;background:#1f2b4a;color:#fff;font-weight:700}
.disc{color:var(--muted);font-size:.7rem;text-align:center;margin:12px 4px}

/* ===== Bottom navigation ===== */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  display:flex;overflow-x:auto;background:rgba(11,14,20,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:0 0 20%;min-width:68px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.66rem;font-weight:600;transition:.2s}
#nav i{font-style:normal;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;color:#fff;opacity:.55;overflow:hidden;transition:.2s}
#nav i img{width:100%;height:100%;object-fit:cover}
#nav button.on{color:var(--blue);text-shadow:0 0 10px rgba(79,172,254,.7)}
#nav button.on i{opacity:1;box-shadow:0 0 0 2px var(--blue),0 0 14px rgba(79,172,254,.8);transform:scale(1.08)}

/* ===== Settings / docs / favorites / colors / rtl ===== */
body.inv{--up:#f6465d;--dn:#0ecb81;--buy:#ff5c5c;--sell:#00c896}
body.inv .buy{background:#3a1717}body.inv .sell{background:#0d3a31}
.rfb.gear{background:#1a2030;box-shadow:none;border:1px solid #2a3350;font-size:1.15rem;margin-right:2px}
.st{flex:none;margin:0 -4px 0 -6px;padding:8px 6px;font-size:1.1rem;line-height:1;color:#566079}
.st.on{color:#f0b90b}
.sh{color:var(--muted);font-size:.72rem;font-weight:700;margin:18px 2px 0;text-transform:uppercase;letter-spacing:.04em}
.sh+.panel{margin-top:8px}
.ol{color:var(--muted);font-size:.78rem;margin:14px 0 7px}
.ol:first-child{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.lrs{padding:2px 14px}
.lr{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid #1f2535;color:var(--text);padding:14px 0;font-size:.95rem;text-align:start;text-decoration:none;font-family:inherit}
.lr:first-child{border-top:0}
.lr span:last-child{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis}
.doc{line-height:1.65;font-size:.9rem}
.doc p,.doc li{color:#c7ccd1}
.doc h3{font-size:1rem;margin:16px 0 6px;color:#f0b90b}
.doc h3:first-child{margin-top:0}
.doc b{font-size:inherit;display:inline}
.doc ul{padding-inline-start:20px;margin:6px 0}
.rtl #setView,.rtl #docView,.rtl .disc,.rtl .hint,.rtl .sub,.rtl #title,.rtl .empty,.rtl .err,.rtl .panel>b{direction:rtl}
.rtl .lr span:first-child{text-align:right}
.rtl .ar{display:inline-block;transform:scaleX(-1)}
</style>
</head>

<!-- ===== Exchange page: list of coins ===== -->
<div id="listView">

    <div id="rows"></div>
  </div>
  <p class="disc" data-i="disc"></p>
</div>

<!-- ===== Chart page ===== -->
<div id="chartView" style="display:none">

  <div class="row" id="tfs"></div>
  <div class="row" id="inds"></div>
  <div class="panel">
    <div class="top"><div class="price" id="price">--</div><div class="badge" id="zone">--</div></div>
    <div class="cw"><canvas id="c"></canvas><button class="now" id="now" data-i="latest"></button></div>
    <div class="err" id="err"></div>
    <p class="hint" data-i="hint"></p>
  </div>
  <div class="panel"><button class="r" id="rf"><svg class="ri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span data-i="refresh"></span></button></div>
  <div class="panel"><b data-i="recent"></b><div id="sigs"></div></div>
</div>

<!-- ===== Settings page ===== -->
<div id="setView" style="display:none">
  <div class="subrow"><h1 data-i="settings"></h1><button class="back" data-back>←</button></div>
  <div id="setBody"></div>
</div>

<!-- ===== Info page (privacy / disclaimer / referral) ===== -->
<div id="docView" style="display:none">
  <div class="subrow"><h1 id="docTitle"></h1><button class="back" data-back>←</button></div>
  <div class="panel" id="docBody"></div>
</div>

<nav id="nav"></nav>

/* ---------- Exchange data parsers (sab ka output: {b:coin, p:price, c:24h%, v:USDT volume}) ---------- */
const STABLE=new Set(['USDC','FDUSD','TUSD','BUSD','DAI','USDP','USDD','USDE','PYUSD','EUR','EURI','AEUR','GBP','TRY','BRL','USD1','XUSD']);
const BAD=/(3L|3S|5L|5S|BULL|BEAR)$/;
function clean(rows){
  const m=new Map();
  rows.forEach(r=>{
    if(!r||!/^[A-Z0-9]{1,15}$/.test(r.b)||STABLE.has(r.b)||BAD.test(r.b))return;
    if(!(r.p>0)||!isFinite(r.p)||!isFinite(r.c))return;
    r.v=isFinite(r.v)?r.v:0;
    if(!m.has(r.b)||m.get(r.b).v<r.v)m.set(r.b,r);
  });
  return [...m.values()];
}
const pct=(last,open)=>open>0?(last-open)/open*100:0;
const num=x=>x==null||x===''?NaN:+x;
const FETCH={
  binance:async()=>{
    const j=await J('https://api.binance.com/api/v3/ticker/24hr');
    return j.filter(x=>x.symbol.endsWith('USDT')).map(x=>({b:x.symbol.slice(0,-4),p:+x.lastPrice,c:+x.priceChangePercent,v:+x.quoteVolume}));
  },
  mexc:async()=>{
    const j=await J('https://api.mexc.com/api/v3/ticker/24hr');
    return j.filter(x=>x.symbol.endsWith('USDT')).map(x=>({b:x.symbol.slice(0,-4),p:+x.lastPrice,c:pct(+x.lastPrice,+x.openPrice),v:+x.quoteVolume}));
  },
  bybit:async()=>{
    const j=await J('https://api.bybit.com/v5/market/tickers?category=spot');
    return j.result.list.filter(x=>x.symbol.endsWith('USDT')).map(x=>({b:x.symbol.slice(0,-4),p:+x.lastPrice,c:+x.price24hPcnt*100,v:+x.turnover24h}));
  },
  okx:async()=>{
    const j=await J('https://www.okx.com/api/v5/market/tickers?instType=SPOT');
    return j.data.filter(x=>x.instId.endsWith('-USDT')).map(x=>({b:x.instId.split('-')[0],p:+x.last,c:pct(+x.last,+x.open24h),v:+x.volCcy24h}));
  },
  bitget:async()=>{
    const j=await J('https://api.bitget.com/api/v2/spot/market/tickers');
    return j.data.filter(x=>x.symbol.endsWith('USDT')).map(x=>({b:x.symbol.slice(0,-4),p:+x.lastPr,c:+x.change24h*100,v:num(x.usdtVolume??x.quoteVolume)}));
  },
  kucoin:async()=>{
    const j=await J('https://api.kucoin.com/api/v1/market/allTickers');
    return j.data.ticker.filter(x=>x.symbol.endsWith('-USDT')).map(x=>({b:x.symbol.split('-')[0],p:+x.last,c:+x.changeRate*100,v:+x.volValue}));
  },
  gate:async()=>{
    const j=await J('https://api.gateio.ws/api/v4/spot/tickers');
    return j.filter(x=>x.currency_pair.endsWith('_USDT')).map(x=>({b:x.currency_pair.split('_')[0],p:+x.last,c:+x.change_percentage,v:+x.quote_volume}));
  },
  /* WEEX: response ka shape pakka maloom nahi, isliye lachakdar parsing */
  weex:async()=>{
    let j=await J('https://api-spot.weex.com/api/v3/market/ticker/24hr');
    const arr=Array.isArray(j)?j:(j.data||j.result||[]);
    return arr.map(x=>{
      const s=String(x.symbol||x.instId||'').replace(/[-_\/]/g,'').toUpperCase();
      if(!s.endsWith('USDT'))return null;
      const p=num(x.lastPrice??x.last??x.close),o=num(x.openPrice??x.open);
      const c=isFinite(o)&&o>0?pct(p,o):num(x.priceChangePercent??x.change);
      const v=num(x.quoteVolume??x.volValue??x.turnover)||(num(x.volume)*p);
      return {b:s.slice(0,-4),p,c,v};
    }).filter(Boolean);
  }
};
/* PROXY: agar kisi exchange ka data seedha na aaye (browser block), to Cloudflare Worker ka link yahan daalein.
   Worker sirf PUBLIC prices laata hai, API keys is mein kabhi nahi jati. Khali ho to proxy use nahi hota. */
const PROXY='https://crypto-proxy.understanding975.workers.dev';
async function J(u){
  try{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e){
    if(!PROXY)throw e;
    const r=await fetch(PROXY+'/?url='+encodeURIComponent(u));
    if(!r.ok)throw new Error('Proxy HTTP '+r.status);
    return r.json();
  }
}

function renderRows(){

  const q=$('q').value.trim().toUpperCase();

  $('rows').innerHTML=rows.map(r=>`<div class="cr" data-open="${r.b}"><div class="cc"><span class="st ${FAV.includes(r.b)?'on':''}" data-fav="${r.b}">${FAV.includes(r.b)?'★':'☆'}</span><img src="${logoURL(r.b)}" data-l="${r.b}" loading="lazy" alt=""><div class="cs"><b>${r.b}</b><small>/USDT</small><div>Vol ${vol(r.v)}</div></div></div><div class="cp">${money(r.p)}</div><div class="cg"><span class="${r.c>=0?'u':'d'}">${r.c>=0?'+':''}${r.c.toFixed(2)}%</span></div></div>`).join('');
}
async function loadList(){
  const id=ex,my=++reqId,b=$('rfl');
  b.classList.add('spin');
  if(!DATA[id])setStatus('',t('loading'));
  try{
    const rows=clean(await FETCH[id]());
    if(!rows.length)throw new Error('empty');
    DATA[id]={rows,t:new Date()};
    if(my===reqId&&id===ex){refreshStatus()}
  }catch(e){
    if(!DATA[id]||DATA[id].err||!DATA[id].rows)DATA[id]={err:1,msg:String((e&&e.message)||e)};
    if(my===reqId&&id===ex)setStatus(DATA[id].err?'bad':'ok',DATA[id].err?t('no_data'):t('old_data'));
  }
  if(my===reqId&&id===ex)renderRows();
  setTimeout(()=>b.classList.remove('spin'),400);
}

/* ---------- Chart code (wahi jo pehle tha) ---------- */
function ema(v,n){const k=2/(n+1);let o=[],p=v[0];v.forEach((x,i)=>{p=i?x*k+p*(1-k):x;o.push(p)});return o}
function rsiCalc(c,n){const o=[];let ag=0,al=0;
  for(let i=0;i<c.length;i++){
    if(!i){o.push(50);continue}
    const df=c[i]-c[i-1],g=Math.max(df,0),l=Math.max(-df,0);
    if(i<=n){ag+=g/n;al+=l/n;o.push(i<n?50:(al===0?100:100-100/(1+ag/al)))}
    else{ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;o.push(al===0?100:100-100/(1+ag/al))}
  }return o}

async function _load(){
  $('err').textContent='';
  const key=coin+'|'+tf;
  try{
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin}USDT&interval=${tf}&limit=500`);
    if(!r.ok)throw new Error('Binance error '+r.status);
    let d=(await r.json()).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
    if(key!==coin+'|'+tf)return;
    if(lastD&&lastKey===key){
      const lt=lastD[lastD.length-1].t;
      if(shift>0&&d[d.length-1].t>lt){let j=d.length-1;while(j>0&&d[j].t>lt)j--;shift+=d.length-1-j}
      d=lastD.filter(z=>z.t<d[0].t).concat(d);
    }
    lastKey=key;
    render(d);
  }catch(e){$('err').textContent=t('err_chart')}
}
async function older(){
  const key=coin+'|'+tf;
  if(olderBusy||!lastD||NOMORE[key]||lastD.length>=4000)return;
  olderBusy=true;
  try{
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin}USDT&interval=${tf}&limit=500&endTime=${lastD[0].t-1}`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=(await r.json()).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
    if(key!==coin+'|'+tf)return;
    if(!rows.length){NOMORE[key]=1}
    else{render(rows.filter(z=>z.t<lastD[0].t).concat(lastD))}
  }catch(e){}
  finally{olderBusy=false}
}

function render(d){
  lastD=d;
  const [fa,sa]=SPD[S.spd]||SPD[1],UC=S.inv?'#ff5c5c':'#00c896',DC=S.inv?'#00c896':'#ff5c5c',UA=a=>S.inv?`rgba(255,92,92,${a})`:`rgba(0,200,150,${a})`,DA=a=>S.inv?`rgba(0,200,150,${a})`:`rgba(255,92,92,${a})`;
  const cl=d.map(z=>z.c),e9=ema(cl,fa),e21=ema(cl,sa),sg=[];
  for(let i=sa+1;i<d.length;i++){
    const a=e9[i-1]-e21[i-1],b=e9[i]-e21[i];
    if(a<=0&&b>0)sg.push({i,t:'BUY',p:cl[i]});
    else if(a>=0&&b<0)sg.push({i,t:'SELL',p:cl[i]});
  }
  const last=cl[cl.length-1],buy=e9[e9.length-1]>e21[e21.length-1];
  $('price').textContent=fmt(last);
  $('zone').textContent=buy?t('buy_zone'):t('sell_zone');
  $('zone').className='badge '+(buy?'buy':'sell');
  $('sigs').innerHTML=sg.slice(-6).reverse().map(s=>`<div class="sig"><span style="color:${s.t==='BUY'?'var(--buy)':'var(--sell)'}">${s.t}</span><span>${fmt(s.p)}</span></div>`).join('')||'<div class="sig"><span>'+t('no_signal')+'</span></div>';

  const e12=ema(cl,12),e26=ema(cl,26),dif=e12.map((q,i)=>q-e26[i]),dea=ema(dif,9),his=dif.map((q,i)=>q-dea[i]),rs=rsiCalc(cl,6);
  vis=Math.max(15,Math.min(vis,d.length,250));shift=Math.max(0,Math.min(shift,d.length-vis));
  const end=d.length-shift,off=end-vis,v=d.slice(off,end),n=v.length,TH=16,ci=cT==null?-1:d.findIndex(z=>z.t===cT),ri=(ci>=off&&ci<end)?ci:end-1;
  $('now').style.display=shift>0?'block':'none';
  if(off<20)older();
  const panes=[IND.vol&&'vol',IND.macd&&'macd',IND.rsi&&'rsi'].filter(Boolean),MH=150,PH=58,H=MH+panes.length*PH+TH;
  const cv=$('c');cv.style.height=H+'px';
  const dpr=Math.min(Math.max(window.devicePixelRatio||1,3),4),W=cv.clientWidth;
  const nw=Math.round(W*dpr),nh=Math.round(H*dpr);if(cv.width!==nw||cv.height!==nh){cv.width=nw;cv.height=nh}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const PX=9,RM=IND.scale?50:9,PY=14,F='-apple-system,Roboto,sans-serif',MUT='#8b93a7';
  const hi=Math.max(...v.map(z=>z.h)),lo=Math.min(...v.map(z=>z.l));
  const Y=q=>PY+(hi-q)/(hi-lo||1)*(MH-PY*2),step=(W-PX-RM)/n,cw=step*.58,X=i=>PX+i*step+step/2;
  const dec=q=>q.toFixed(q>=100?1:q>=1?3:5);
  x.font='9px '+F;x.textBaseline='middle';x.textAlign='left';
  if(IND.scale){
    for(let g=0;g<4;g++){const q=lo+(hi-lo)*g/3,yy=Y(q);
      x.strokeStyle='#1c2233';x.lineWidth=1;x.beginPath();x.moveTo(0,yy);x.lineTo(W-RM,yy);x.stroke();
      x.fillStyle=MUT;x.fillText(dec(q),W-RM+4,yy)}
  }
  v.forEach((z,i)=>{
    x.strokeStyle=x.fillStyle=z.c>=z.o?UC:DC;
    x.lineWidth=1;x.beginPath();x.moveTo(X(i),Y(z.h));x.lineTo(X(i),Y(z.l));x.stroke();
    x.fillRect(X(i)-cw/2,Y(Math.max(z.o,z.c)),cw,Math.max(1,Math.abs(Y(z.o)-Y(z.c))));
  });
  const line=(ar,col,fy,w)=>{x.strokeStyle=col;x.lineWidth=w||1.1;x.lineJoin='round';x.beginPath();ar.slice(off,end).forEach((q,i)=>{i?x.lineTo(X(i),fy(q)):x.moveTo(X(i),fy(q))});x.stroke()};
  if(IND.ema){
    line(e9,'#3ddc97',Y);line(e21,'#f0a040',Y);
    sg.filter(t=>t.i>=off&&t.i<end).forEach(t=>{
      const i=t.i-off,z=d[t.i],b=t.t==='BUY',yy=b?Y(z.l)+9:Y(z.h)-9,cx=X(i);
      x.fillStyle=b?UC:DC;x.beginPath();
      if(b){x.moveTo(cx,yy-4);x.lineTo(cx-4,yy+3);x.lineTo(cx+4,yy+3)}
      else{x.moveTo(cx,yy+4);x.lineTo(cx-4,yy-3);x.lineTo(cx+4,yy-3)}
      x.closePath();x.fill();
    });
  }
  if(IND.scale&&shift===0){
    const col=buy?UC:DC,ly=Y(last);
    x.setLineDash([3,3]);x.strokeStyle=col;x.lineWidth=1;x.beginPath();x.moveTo(0,ly);x.lineTo(W-RM,ly);x.stroke();x.setLineDash([]);
    x.fillStyle=col;x.fillRect(W-RM+1,ly-7,RM-2,14);x.fillStyle='#06121f';x.font='bold 9px '+F;x.fillText(dec(last),W-RM+4,ly);
  }
  const seg=(t,c,st)=>{x.fillStyle=c;x.font='9px '+F;x.fillText(t,st.x,st.y);st.x+=x.measureText(t).width+8};
  panes.forEach((p,k)=>{
    const y0=MH+k*PH,top=y0+16,bot=y0+PH-4;
    x.strokeStyle='#1c2233';x.lineWidth=1;x.beginPath();x.moveTo(0,y0);x.lineTo(W,y0);x.stroke();
    const st={x:PX,y:y0+8};
    if(p==='vol'){
      const mx=Math.max(...v.map(z=>z.v))||1,lv=d[ri].v;
      seg('VOL',MUT,st);seg(lv>=1000?(lv/1000).toFixed(1)+'K':lv.toFixed(2),'#f0b90b',st);
      v.forEach((z,i)=>{x.fillStyle=z.c>=z.o?UA(.7):DA(.7);const h=Math.max(1,z.v/mx*(bot-top));x.fillRect(X(i)-cw/2,bot-h,cw,h)});
    }
    if(p==='macd'){
      const sl=ar=>ar.slice(off,end),mx=Math.max(...sl(dif).map(Math.abs),...sl(dea).map(Math.abs),...sl(his).map(Math.abs))||1;
      const zy=(top+bot)/2,my=q=>zy-q/mx*(bot-top)/2;
      seg('MACD',MUT,st);seg('DIF '+dif[ri].toFixed(2),'#f0b90b',st);seg('DEA '+dea[ri].toFixed(2),'#e84393',st);seg(his[ri].toFixed(2),'#a78bfa',st);
      x.strokeStyle='#1c2233';x.lineWidth=1;x.beginPath();x.moveTo(0,zy);x.lineTo(W-RM,zy);x.stroke();
      sl(his).forEach((q,i)=>{x.fillStyle=q>=0?UA(.75):DA(.75);x.fillRect(X(i)-cw/2,Math.min(zy,my(q)),cw,Math.max(1,Math.abs(my(q)-zy)))});
      line(dif,'#f0b90b',my,1);line(dea,'#e84393',my,1);
    }
    if(p==='rsi'){
      const ry=q=>bot-q/100*(bot-top);
      seg('RSI(6)',MUT,st);seg(rs[ri].toFixed(2),'#f0b90b',st);
      x.setLineDash([3,3]);x.strokeStyle='#2a3350';x.lineWidth=1;
      [30,70].forEach(q=>{x.beginPath();x.moveTo(0,ry(q));x.lineTo(W-RM,ry(q));x.stroke()});x.setLineDash([]);
      if(IND.scale){x.fillStyle=MUT;x.font='9px '+F;x.fillText('70',W-RM+4,ry(70));x.fillText('30',W-RM+4,ry(30))}
      line(rs,'#f0b90b',ry,1.1);
    }
  });

  /* ---- time axis ---- */
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p2=q=>String(q).padStart(2,'0'),intra=tf!=='1d';
  const fT=(ms,full)=>{const q=new Date(ms),dm=p2(q.getDate())+' '+MON[q.getMonth()],hm=p2(q.getHours())+':'+p2(q.getMinutes());return intra?(full?dm+' '+hm:hm):(full?dm+' '+q.getFullYear():dm)};
  const gap=Math.max(1,Math.ceil(72/step));
  x.font='9px '+F;x.textAlign='center';x.textBaseline='middle';x.fillStyle=MUT;
  for(let i=0;i<n;i++){
    if((off+i)%gap)continue;
    const cx=X(i);if(cx<24||cx>W-RM-24)continue;
    const z=d[off+i],pz=d[off+i-1],newDay=intra&&pz&&new Date(pz.t).getDate()!==new Date(z.t).getDate();
    x.fillText(intra&&newDay?p2(new Date(z.t).getDate())+' '+MON[new Date(z.t).getMonth()]:fT(z.t,false),cx,H-TH/2);
  }
  x.textAlign='left';
  /* ---- crosshair ---- */
  if(ci>=off&&ci<end){
    const z=d[ci],cx=X(ci-off),cy=Y(z.c);

    x.fillStyle='#2b3350';x.fillRect(lx,H-TH+1,tw,TH-2);x.fillStyle='#fff';x.fillText(tl,lx+5,H-TH/2);
    if(IND.scale){x.fillStyle='#2b3350';x.fillRect(W-RM+1,cy-7,RM-2,14);x.fillStyle='#fff';x.fillText(dec(z.c),W-RM+4,cy)}

    x.font='9px '+F;const bw=Math.max(...L.map(q=>x.measureText(q).width))+12,bx=cx>(W-RM)/2?PX:W-RM-bw-4;

    L.forEach((q,k)=>{x.fillStyle=k===2?(chg>=0?UC:DC):'#c7ccd1';x.fillText(q,bx+6,12+k*12)});

}

  else if(tg.closest('#now')){shift=0;cT=null;if(lastD)render(lastD)}
  else if(tg.closest('#rf'))load();
});

/* ---------- Chart gestures: pan / pinch / tap ---------- */
(function(){
  const cv=$('c'),P=new Map();
  let mode=null,sx=0,sShift=0,sVis=0,sDist=0,lp=0,raf=0,lastX=0;
  const rr=()=>{if(raf||!lastD)return;raf=requestAnimationFrame(()=>{raf=0;if(lastD)render(lastD)})};
  const geo=()=>{const W=cv.clientWidth,RM=IND.scale?50:9;return{st:(W-9-RM)/vis}};
  const pick=px=>{
    if(!lastD)return null;
    const st=geo().st,end=lastD.length-shift,off=end-vis;
    const i=Math.max(0,Math.min(vis-1,Math.floor((px-9)/st)));
    return lastD[off+i]?lastD[off+i].t:null;
  };
  const dist=()=>{const a=[...P.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1};
  cv.addEventListener('pointerdown',e=>{
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=cv.getBoundingClientRect();lastX=e.clientX-r.left;
    if(P.size===1){
      mode='tap';sx=e.clientX;sShift=shift;
      clearTimeout(lp);
      lp=setTimeout(()=>{if(mode==='tap'){mode='cross';const t=pick(lastX);if(t!=null){cT=t;rr()}}},380);
    }else if(P.size===2){clearTimeout(lp);mode='pinch';sDist=dist();sVis=vis}
  });
  cv.addEventListener('pointermove',e=>{
    if(!P.has(e.pointerId))return;
    P.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=cv.getBoundingClientRect();lastX=e.clientX-r.left;
    if(mode==='pinch'&&P.size===2){vis=Math.round(sVis*sDist/dist());rr()}
    else if(mode==='tap'&&Math.abs(e.clientX-sx)>8){clearTimeout(lp);mode='pan'}
    if(mode==='pan'){shift=sShift+Math.round((e.clientX-sx)/geo().st);rr()}
    else if(mode==='cross'){const t=pick(lastX);if(t!=null){cT=t;rr()}}
  });
  const up=(e,cancel)=>{
    if(!P.has(e.pointerId))return;
    clearTimeout(lp);
    if(mode==='tap'&&!cancel){const t=pick(lastX);cT=(t!=null&&t!==cT)?t:null;rr()}
    P.delete(e.pointerId);
    mode=null;
  };
  cv.addEventListener('pointerup',e=>up(e,false));
  cv.addEventListener('pointercancel',e=>up(e,true));
  cv.addEventListener('contextmenu',e=>e.preventDefault());
})();
$('q').addEventListener('input',renderRows);
window.addEventListener('popstate',e=>{
  const v=e.state&&e.state.v;
  if(v==='set')showSet(false);else if(v==='doc')showDoc(docKey,false);else if(view!=='list')showList();
});
/* Logo na mile to coin ka pehla harf dikhao */
document.addEventListener('error',e=>{
  const i=e.target;if(!i||i.tagName!=='IMG'||!i.dataset.l)return;
  const d=document.createElement('div');d.className='lf';d.textContent=i.dataset.l[0];d.style.background=COL[i.dataset.l]||'#3a4560';i.replaceWith(d);
},true);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(view==='chart'&&lastD)render(lastD)},250)});

/* ---------- Shuru ---------- */
applyColors();applyLang();showList();
let tick=0;
setInterval(()=>{if(document.hidden||!S.auto)return;tick++;if(view==='chart')load();else if(view==='list'&&tick%3===0)loadList()},10000); // chart 10s, list 30s
</script>
